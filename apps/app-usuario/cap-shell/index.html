<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ruum Ruum</title>
  <style>
    :root {
      color-scheme: dark light;
    }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #070b14;
      color: #f6f8fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: env(safe-area-inset-top, 24px) 24px env(safe-area-inset-bottom, 24px);
    }
    .card {
      max-width: 320px;
      padding: 28px 24px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    p {
      margin: 0 0 20px;
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 20px;
      width: 100%;
      cursor: pointer;
    }
    button:active {
      opacity: 0.88;
    }
  </style>
</head>
<body>
  <main class="card" role="main" aria-live="polite">
    <h1>Sin conexión a internet</h1>
    <p>No hay conexión para cargar Ruum Ruum. Conéctate a internet e inténtalo de nuevo.</p>
    <button type="button" id="btn-reintentar">Reintentar conexión</button>
  </main>
  <script>
    (function () {
      var btn = document.getElementById("btn-reintentar");
      if (btn) {
        btn.addEventListener("click", function () {
          window.location.reload();
        });
      }
      window.addEventListener("online", function () {
        window.location.reload();
      });
    })();
  </script>
</body>
</html>
