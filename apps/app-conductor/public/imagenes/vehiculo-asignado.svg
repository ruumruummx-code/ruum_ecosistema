<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" fill="none">
  <defs>
    <linearGradient id="carBody" x1="20" y1="25" x2="220" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="45%" stop-color="#E2E8F0" />
      <stop offset="75%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="carSide" x1="30" y1="55" x2="210" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="carGlass" x1="60" y1="26" x2="180" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.38" />
      <stop offset="70%" stop-color="#0F172A" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="120" cy="102" rx="102" ry="11" fill="url(#shadowGrad)" />

  <!-- Main body silhouette -->
  <path d="M22 74 C22 63, 34 55, 54 51 L86 30 C98 23, 146 21, 174 27 L206 47 C216 52, 222 61, 222 74 L220 88 C220 93, 214 96, 204 96 L36 96 C26 96, 22 92, 22 86 Z" fill="url(#carBody)" stroke="#94A3B8" stroke-width="1.2" />

  <!-- Lower side panel contour -->
  <path d="M24 76 L218 73 L216 89 C216 93, 210 95, 202 95 L36 95 C28 95, 24 91, 24 85 Z" fill="url(#carSide)" />

  <!-- Cabin / Windows -->
  <path d="M62 51 L90 33 C101 27, 144 25, 169 30 L195 48 C162 51, 104 52, 62 51 Z" fill="url(#carGlass)" />
  <!-- Window pillars -->
  <path d="M126 27 L122 51" stroke="#CBD5E1" stroke-width="3" />
  <path d="M164 29 L160 50" stroke="#CBD5E1" stroke-width="2.5" />
  <!-- Windshield reflection -->
  <path d="M67 49 L92 34 L106 33 L82 49 Z" fill="#64748B" fill-opacity="0.45" />

  <!-- Front grille & bumper detail -->
  <path d="M22 72 C24 66, 33 62, 46 62 L52 68 L44 77 L23 77 Z" fill="#1E293B" />
  <path d="M25 82 L50 82 L47 90 L25 90 Z" fill="#0F172A" />
  <!-- Headlight -->
  <path d="M44 57 C52 56, 62 58, 66 63 C59 66, 48 66, 42 63 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="1" />
  <circle cx="56" cy="61" r="2.2" fill="#38BDF8" />

  <!-- Side mirror -->
  <ellipse cx="77" cy="52" rx="6" ry="3.8" fill="#E2E8F0" stroke="#64748B" stroke-width="1" />

  <!-- Door crease lines & handles -->
  <path d="M84 66 L194 63" stroke="#64748B" stroke-width="1" stroke-opacity="0.5" />
  <rect x="112" y="57" width="10" height="2.5" rx="1.2" fill="#64748B" />
  <rect x="152" y="56" width="10" height="2.5" rx="1.2" fill="#64748B" />

  <!-- Front wheel (left) -->
  <circle cx="76" cy="88" r="17" fill="#0F172A" />
  <circle cx="76" cy="88" r="13.5" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
  <circle cx="76" cy="88" r="9.5" fill="#CBD5E1" />
  <circle cx="76" cy="88" r="3" fill="#334155" />
  <path d="M76 78.5 L76 97.5 M66.5 88 L85.5 88 M69.3 81.3 L82.7 94.7 M82.7 81.3 L69.3 94.7" stroke="#475569" stroke-width="1.6" />

  <!-- Rear wheel (right) -->
  <circle cx="182" cy="87" r="16.5" fill="#0F172A" />
  <circle cx="182" cy="87" r="13" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
  <circle cx="182" cy="87" r="9" fill="#CBD5E1" />
  <circle cx="182" cy="87" r="2.8" fill="#334155" />
  <path d="M182 78 L182 96 M173 87 L191 87 M175.6 80.6 L188.4 93.4 M188.4 80.6 L175.6 93.4" stroke="#475569" stroke-width="1.6" />
</svg>
