import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def rumVersion = new JsonSlurper().parse(file('../../../../config/app-version.json'))
def rumRemoteUrl = providers.gradleProperty('rumRemoteUrl').orElse(System.getenv('RUUM_REMOTE_URL') ?: 'https://www.concer.ruumruum-moviliax.online').get()
if (!rumRemoteUrl.startsWith('https://')) throw new GradleException('RUUM_REMOTE_URL must use https://')

android {
    namespace = "com.moviliax.ruumruum.conductor"
    compileSdk = libs.versions.compileSdk.get().toInteger()
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "com.moviliax.ruumruum.conductor"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rumVersion.versionCode as int
        versionName rumVersion.version as String
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "RUUM_REMOTE_URL", "\"${rumRemoteUrl}\""
        androidResources {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def keystorePath = System.getenv("RUUM_ANDROID_KEYSTORE_PATH")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("RUUM_ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RUUM_ANDROID_KEY_ALIAS")
                keyPassword System.getenv("RUUM_ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("RUUM_ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    google()
    mavenCentral()
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation libs.androidx.appcompat
    implementation libs.androidx.coordinatorlayout
    implementation libs.androidx.core.splashscreen
    implementation libs.play.services.location
    implementation libs.androidx.security.crypto
    implementation libs.androidx.work.runtime
    implementation project(':capacitor-android')
    
    // Unit testing
    testImplementation libs.junit
    testImplementation libs.mockito.core
    testImplementation libs.mockito.kotlin
    testImplementation libs.kotlinx.coroutines.test
    
    // Instrumentation testing
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.core
    androidTestImplementation libs.androidx.runner
    androidTestImplementation libs.androidx.rules
    
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception ignored) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
