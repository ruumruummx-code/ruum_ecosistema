name: Uptime app-conductor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: conductor-healthcheck
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  healthcheck:
    name: Synthetic GET /api/health
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verificar disponibilidad y salud de Supabase
        run: node apps/app-conductor/scripts/healthcheck.mjs
        env:
          CONDUCTOR_HEALTHCHECK_URL: ${{ vars.CONDUCTOR_HEALTHCHECK_URL }}
      - name: Enlazar resultado para triage
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## 🚨 App Conductor: falló el health check sintético"
            echo ""
            echo "El endpoint no respondió con HTTP 200 y Supabase sano tras dos intentos."
            echo "Revisar el [run de GitHub Actions]($RUN_URL) y seguir apps/app-conductor/docs/ops/RUNBOOK_HEALTH.md."
          } >> "$GITHUB_STEP_SUMMARY"
