name: App Usuario
on:
  pull_request:
  push:
    branches: [main, 'codex/app-usuario-rc']
permissions:
  contents: read
jobs:
  reconciliacion-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - name: Aplicar todas las migraciones a una base limpia
        run: supabase db start
      - name: Verificar reconciliación individual
        run: |
          docker exec -i supabase_db_ruum psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < apps/app-usuario/test/reconciliacion-individual.sql

  usuario:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-supabase-security.mjs
      - run: pnpm --filter @ruum/app-usuario lint
      - run: pnpm --filter @ruum/app-usuario typecheck
      - run: pnpm --filter @ruum/app-usuario build
        env:
          NODE_ENV: production
          PLAYWRIGHT_E2E_PRODUCCION: '1'
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54399
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_local_mock
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_local_mock
          NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: pk.localmock
          MAPBOX_SECRET_TOKEN: sk.localmock
          PHONE_VERIFY_SECRET: phone-verification-local-fixture-32
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_localmock
          STRIPE_SECRET_KEY: sk_test_localmock
          TWILIO_ACCOUNT_SID: AC_localmock
          TWILIO_AUTH_TOKEN: localmock
          TWILIO_VERIFY_SERVICE_SID: VA_localmock
          UPSTASH_REDIS_REST_URL: http://127.0.0.1:54400
          UPSTASH_REDIS_REST_TOKEN: e2e-redis-token
          RUUM_LOCAL_PRODUCTION: 'true'
      - run: pnpm --filter @ruum/app-usuario exec playwright install --with-deps chromium
      - name: Comprobar el diseño responsive con el CSS del build productivo
        run: pnpm --filter @ruum/app-usuario exec vitest run test/inicio-responsive.test.tsx test/traslados-responsive.test.tsx
        env:
          RUN_RESPONSIVE_UI: '1'
          RESPONSIVE_UI_BUILD_DIR: .next-e2e
      - run: pnpm --filter @ruum/app-usuario test:e2e
        env:
          PLAYWRIGHT_E2E_PRODUCCION: '1'
          PLAYWRIGHT_DISABLE_AUTH_ARTIFACTS: '1'
      - run: pnpm --filter @ruum/app-usuario test:coverage
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: app-usuario-coverage
          path: apps/app-usuario/coverage/
          if-no-files-found: warn
