name: Packages Core
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_e2e_only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-packages-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-packages-
      - run: pnpm install --frozen-lockfile
      - name: Build & Typecheck Packages
        run: |
          pnpm --filter @ruum/shared build
          pnpm --filter @ruum/ui build
          pnpm --filter @ruum/api build
      - name: Test Packages
        run: |
          pnpm --filter @ruum/shared test
          pnpm --filter @ruum/api test
