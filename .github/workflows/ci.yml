# CI del monorepo Ruum: instala con lockfile congelado y corre
# lint, typecheck, unit, fronteras, secretos, auditoría, SQL (Supabase local)
# y Edge Functions (Deno). Ver README.md "CI y despliegue".
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test

jobs:
  install:
    name: install (frozen lockfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    name: test unit
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  # RC-10: `test:unit` filtra sólo packages/*; la app de usuario (flujos
  # críticos: wizard, pago, cuenta, mis-viajes) no se certificaba en CI.
  usuario:
    name: test app-usuario
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ruum/app-usuario test

  # Job dedicado para pruebas unitarias de app-conductor.
  unit-conductor:
    name: test app-conductor (unit)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ruum/app-conductor test

  # T04 (cierra RC-10): E2E de app-usuario con build de producción, obligatorio
  # en la rama candidata.
  #
  # Reproducibilidad: lockfile congelado, versión de Node pineada (.nvmrc),
  # Chromium instalado por la versión de @playwright/test del lockfile y
  # Playwright corriendo en 1 worker con reintentos (CI=true).
  #
  # Hermética: no requiere proyecto Supabase ni secretos de Stripe/Mapbox
  # reales. `playwright.config.ts` levanta un doble local de GoTrue+PostgREST
  # (tests/e2e/fixtures/mock-supabase.mjs) y apunta la app a él; el build usa
  # RUUM_LOCAL_PRODUCTION=true para admitir ese http:// de loopback (lo permite
  # scripts/validate-env.mjs, pensado para el Compose local).
  e2e-usuario:
    name: e2e app-usuario (Playwright)
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 45
    env:
      # La suite apunta al doble local; build y runtime deben ver la misma URL.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54399
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_anon_key_e2e_mock
      RUUM_LOCAL_PRODUCTION: "true"
      NEXT_PUBLIC_RUUM_AMBIENTE: production
      NEXT_PUBLIC_APP_VERSION: 1.0.0
      NEXT_PUBLIC_APP_URL: http://localhost:3012
      # Placeholders con la forma exigida por scripts/validate-env.mjs (pk./sk.)
      # y longitud mínima: los E2E mockean Mapbox en el navegador.
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: pk.eyJuY19lMmVfcGxhY2Vob2xkZXIifQ
      MAPBOX_SECRET_TOKEN: sk.test-placeholder
      PHONE_VERIFY_SECRET: e2e-placeholder-secret-con-mas-de-32-caracteres
      # /registro usa el bypass de OTP solo en entornos no productivos.
      PHONE_VERIFY_BYPASS: "true"
      NEXT_PUBLIC_PHONE_VERIFY_BYPASS: "true"
      # Servir el build de producción en vez de `next dev`.
      PLAYWRIGHT_E2E_PRODUCCION: "1"
      # Los artefactos (traces/vídeos) se suben igualmente si algo falla.
      PLAYWRIGHT_DISABLE_AUTH_ARTIFACTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Instalar Chromium (versión del lockfile)
        run: pnpm exec playwright install --with-deps chromium
      - name: Build de producción app-usuario
        run: pnpm --filter @ruum/app-usuario build
      - name: Ejecutar E2E
        run: pnpm --filter @ruum/app-usuario test:e2e
      - name: Subir reporte y artefactos Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-app-usuario-${{ github.run_id }}
          path: |
            apps/app-usuario/playwright-report
            apps/app-usuario/test-results
          retention-days: 14
          if-no-files-found: ignore


  # Sprint C5: E2E de flujos críticos del conductor (login, traslados, offline,
  # registro móvil, recuperación de contraseña). Obligatorio en CI para
  # certificar la experiencia del conductor antes de cada merge.
  e2e-conductor:
    name: e2e app-conductor (Playwright sprint-c5)
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54399
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_anon_key_e2e_mock
      RUUM_LOCAL_PRODUCTION: "true"
      NEXT_PUBLIC_RUUM_AMBIENTE: production
      NEXT_PUBLIC_APP_VERSION: 1.0.0
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: pk.eyJuY19lMmVfcGxhY2Vob2xkZXIifQ
      MAPBOX_SECRET_TOKEN: sk.test-placeholder
      PHONE_VERIFY_SECRET: e2e-placeholder-secret-con-mas-de-32-caracteres
      PHONE_VERIFY_BYPASS: "true"
      NEXT_PUBLIC_PHONE_VERIFY_BYPASS: "true"
      PLAYWRIGHT_E2E_PRODUCCION: "1"
      PLAYWRIGHT_DISABLE_AUTH_ARTIFACTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Instalar Chromium (versión del lockfile)
        run: pnpm exec playwright install --with-deps chromium
      - name: Build de producción app-conductor
        run: pnpm --filter @ruum/app-conductor build
      - name: Ejecutar E2E sprint-c5-critical-flows
        run: pnpm --filter @ruum/app-conductor test:e2e:critical
      - name: Subir reporte y artefactos Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-app-conductor-${{ github.run_id }}
          path: |
            apps/app-conductor/playwright-report
            apps/app-conductor/test-results
          retention-days: 14
          if-no-files-found: ignore

  fronteras:
    name: check fronteras
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:fronteras

  migrations:
    name: check migrations
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:migrations

  release:
    name: changelog test
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release
      - run: pnpm changelog -- --since HEAD~5

  native:
    name: check native (sin SDK)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:native
      - run: pnpm scan:secrets

  secrets:
    name: scan secrets
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm scan:secrets

  audit:
    name: audit deps
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:deps

  sql:
    name: test sql (Supabase local)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Versión pineada (no `latest`): resolver "latest" pega al API de
      # GitHub y tumba el job con rate-limit. Actualizar deliberadamente.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - run: pnpm install --frozen-lockfile
      - run: supabase start
      - run: pnpm test:sql

  tipos:
    name: tipos supabase sincronizados + sin casts rpc
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Misma versión pineada que el job `sql` (ver comentario allí).
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - run: pnpm install --frozen-lockfile
      - run: supabase start
      - run: supabase gen types typescript --local > packages/shared/src/types/supabase.ts
      - run: git diff --exit-code packages/shared/src/types/supabase.ts
      - run: pnpm check:rpc-casts

  deno:
    name: deno check + test
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task check:functions
      - run: deno task test:functions
